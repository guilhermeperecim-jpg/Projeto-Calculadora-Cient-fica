<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Conversor de Bases</title>
  <meta name="description" content="Simple Calculator With Dark Mode." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="../assets/calculator.ico">
  <link rel="stylesheet" href="../styles/dark.css" id="theme" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="wrapper">
    <div class="container">
      <div class="header-container">
        <!-- This heading also notifies about the theme change.-->
        <h1 id="toast"> Conversor de Bases</h1>
        <div class="top-buttons">
          <a href="https://github.com/guilhermeperecim-jpg/Projeto-Calculadora-Cient-fica">
            <img src="../assets/GitHubLight.svg" alt="GitHub" height="25" width="30" id="github-icon">
          </a>
          <button type="button" onclick="changeThemeConversor()" class="theme-button">
            <img src="../assets/SunIcon.svg" alt="Theme Icon" height="25" width="25" id="theme-icon">
          </button>
          <a href="../index.html">
            <img src="../assets/iconeConversorBases.png" alt="Calculadora" height="35" width="35" id="calculator">
          </a>
        </div>
      </div>

      <div class="caixa">
        <input type="text" name="base-entrada" id="base-entrada" placeholder="Digite a base de entrada" />
      </div>

      <div class="caixa">
        <input type="text" name="base-saida" id="base-saida" placeholder="Digite a base de saída" />
      </div>

      <div class="caixa">
        <input type="text" name="num-convert" id="num-convert" placeholder="Digite o número a ser convertido"  />
      </div>

      <div class="caixa-final">
        <input type="text" name="result-bases" id="result-bases" readonly />
      </div>

      <button class="btn-converter" onclick="calculateBase()">Converter</button>
      
    </div>
  </div>
  <script src="../scripts/script.js"></script>
</body>

</html>
