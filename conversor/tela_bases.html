<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Conversor de Bases</title>
  <meta name="description" content="Simple Calculator With Dark Mode." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="../assets/calculator.ico">
  <link rel="stylesheet" href="../styles/style.css" id="theme" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Orbitron:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="wrapper dark">
    <div class="container">
      <div class="header-container">
        <!-- This heading also notifies about the theme change.-->
        <h1 id="toast"> Conversor de Bases</h1>
        <div class="top-buttons">
          <a href="https://github.com/guilhermeperecim-jpg/Projeto-Calculadora-Cient-fica">
            <img src="../assets/GitHubLight.svg" alt="GitHub" height="25" width="30" id="github-icon">
          </a>
          <button type="button" onclick="changeTheme()" class="theme-button">
            <img src="../assets/SunIcon.svg" alt="Theme Icon" height="25" width="25" id="theme-icon">
          </button>
          <a href="../index.html">
            <img src="../assets/calculator.ico.png" alt="Calculadora" height="35" width="35" id="calculator">
          </a>
          <a href="../plano/tela_plano.html">
            <img src="../assets/Icon_do_plano_cartesiano_certo.png" alt="Plano Cartesiano" height="30" width="30" id="plano-icon">
          </a>
        </div>
      </div>

<div class="conversor-panel">
  <div class="section-header">

  </div>

  <p class="conversor-descricao">
    <h2>Informe as bases e o número que deseja converter.</h2><br>
  </p>

  <div class="inputs-grid conversor-grid">
    <div class="input-group">
      <label for="base-entrada">Base de entrada</label>
      <input type="number" name="base-entrada" id="base-entrada" min="2" max="36" placeholder="Ex.: 10">
    </div>

    <div class="input-group">
      <label for="base-saida">Base de saída</label>
      <input type="number" name="base-saida" id="base-saida" min="2" max="36" placeholder="Ex.: 2">
    </div>
  </div>

  <div class="input-group numero-group">
    <label for="num-convert">Número para converter</label>
    <input type="text" name="num-convert" id="num-convert" placeholder="Digite o número">
  </div>

  <div class="resultado-panel">
    <label for="result-bases">Resultado</label>
    <textarea name="result-bases" id="result-bases" placeholder="O resultado aparecerá aqui" readonly></textarea>
  </div>

  <button type="button" class="btn-converter" onclick="calculateBase()">
    Converter
  </button>
</div>

  <script src="../scripts/script.js"></script>
</body>

</html>
