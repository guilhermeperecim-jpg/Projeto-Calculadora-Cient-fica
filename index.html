<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Calculadora</title>
  <meta name="description" content="Simple Calculator With Dark Mode." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="assets/calculator.ico">
  <link rel="stylesheet" href="styles/dark.css" id="theme" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>

<body>
  <div class="wrapper">
    <div class="container">
      <div class="header-container">
        <!-- This heading also notifies about the theme change.-->
        <h1 id="toast">Calculadora</h1>
        <div class="top-buttons">
          <a href="https://github.com/guilhermeperecim-jpg/Projeto-Calculadora-Cient-fica">
            <img src="assets/GitHubLight.svg" alt="Sun Icon" height="22.5" width="22.5" id="github-icon">
          </a>
          <button type="button" onclick="changeTheme()" class="theme-button">
            <img src="assets/SunIcon.svg" alt="Theme Icon" height="19" width="19" id="theme-icon">
          </button>
        </div>
      </div>

      <div class="first-row">
        <input type="text" name="result" id="result" placeholder="Digite um número" readonly />
        <input type="button" value="C" onclick="result.value=''" id="clear-button" />
      </div>

      <div class="button-grid">
        <button onclick="liveScreen(1)">1</button>
        <button onclick="liveScreen(2)">2</button>
        <button onclick="liveScreen(3)">3</button>
        <button onclick="liveScreen('+')">+</button>

        <button onclick="liveScreen(4)">4</button>
        <button onclick="liveScreen(5)">5</button>
        <button onclick="liveScreen(6)">6</button>
        <button onclick="liveScreen('-')">-</button>

        <button onclick="liveScreen(7)">7</button>
        <button onclick="liveScreen(8)">8</button>
        <button onclick="liveScreen(9)">9</button>
        <button onclick="liveScreen('*')">*</button>

        <button onclick="liveScreen(0)">0</button>
        <button onclick="liveScreen('00')">00</button>
        <button onclick="liveScreen('.')">.</button>
        <button onclick="liveScreen('/')">/</button>

        <button onclick="calcularRaiz(result.value)">√</button>
        <button onclick="liveScreen('**')">^</button>
        <button onclick="calcularExponencial(result.value)">eˣ</button>
        <button onclick="calcularLog(result.value)">log</button>

        <button onclick="livescreen('(')">(</button>
        <button onclick="liveScreen(')')">)</button>
        <button onclick="calcularLn(result.value)">ln</button>
        <button id="igual" onclick="calculate(result.value)">=</button>
       
      </div>
    </div>
  </div>
  <script src="scripts/script.js"></script>
</body>

</html>
